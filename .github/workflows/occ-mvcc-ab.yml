name: OccSTM MVCC versioned-lock A/B
on:
  push:
    branches: [codex/occ-versioned-mvcc-20261118]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build baseline and candidate (identical compiler / allocator)
        run: |
          git worktree add --detach /tmp/castm-baseline 7ceb0a73f23fc72da050f09b2b8070c2137f6b2c
          cmake -S /tmp/castm-baseline -B /tmp/castm-baseline-build -DCMAKE_BUILD_TYPE=Release -DSTM_ALLOCATOR_MODE=0
          cmake --build /tmp/castm-baseline-build --target stm_benchmark -j2
          cmake -S . -B /tmp/castm-candidate-build -DCMAKE_BUILD_TYPE=Release -DSTM_ALLOCATOR_MODE=0
          cmake --build /tmp/castm-candidate-build --target stm_benchmark -j2
      - name: Three alternating short runs per workload
        run: |
          python3 - <<'PY'
          import csv, io, json, pathlib, statistics, subprocess
          paths = {
              "baseline": "/tmp/castm-baseline-build/benchmarks/stm_benchmark",
              "candidate": "/tmp/castm-candidate-build/benchmarks/stm_benchmark",
          }
          workloads = [(1, 90, "low"), (4, 90, "low"),
                       (1, 50, "high"), (4, 50, "high"),
                       (4, 10, "high")]
          results = []
          for threads, rr, contention in workloads:
              for repetition in range(1, 4):
                  order = ["candidate", "baseline"] if repetition % 2 else ["baseline", "candidate"]
                  for side in order:
                      args = [paths[side], "--backend", "occ",
                              "--threads", str(threads), "--read-ratio", str(rr),
                              "--contention", contention, "--warmup-ms", "200",
                              "--measure-ms", "500", "--run", str(repetition),
                              "--csv"]
                      run = subprocess.run(args, capture_output=True, text=True, timeout=40)
                      rows = list(csv.DictReader(io.StringIO(run.stdout)))
                      row = rows[0] if len(rows) == 1 else {}
                      out = {
                          "side": side, "threads": threads, "read_ratio": rr,
                          "contention": contention, "run": repetition,
                          "valid": row.get("valid", "0") if run.returncode == 0 else "0",
                          "tps": row.get("throughput_tps", ""),
                          "abort_rate": row.get("abort_rate", ""),
                          "p99_us": row.get("p99_us", ""),
                          "error": (row.get("error", "") or run.stderr.strip())[:350]
                      }
                      results.append(out)
                      print(json.dumps(out, ensure_ascii=False), flush=True)
          pathlib.Path("perf-ab.json").write_text(json.dumps(results, indent=2))
          print("\n=== SUMMARY: 3 short runs, same runner, system allocator ===")
          for workload in workloads:
              threads, rr, contention = workload
              series = {side: [x for x in results if
                        (x["threads"], x["read_ratio"], x["contention"]) == workload
                        and x["side"] == side and x["valid"] == "1"]
                        for side in paths}
              n = {side: len(rows) for side, rows in series.items()}
              mean = {side: (statistics.mean(float(x["tps"]) for x in rows) if rows else float("nan"))
                      for side, rows in series.items()}
              ratio = mean["candidate"] / mean["baseline"] if mean["baseline"] > 0 else float("nan")
              print(f"{threads=} {rr=} {contention=} valid={n} "
                    f"baseline={mean['baseline']:.0f}tps candidate={mean['candidate']:.0f}tps ratio={ratio:.3f}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occ-mvcc-baseline-vs-candidate
          path: perf-ab.json
